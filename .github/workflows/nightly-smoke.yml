name: Nightly Prod Smoke

# Dead-man switch for the live terminal. Runs the @smoke e2e suite plus
# freshness assertions against production every weekday morning before the
# open, and after every deploy to main. When it fails it opens (or updates)
# a pinned GitHub issue with the failure list — a silent regression on prod
# should never again sit unnoticed for weeks.
#
# Secrets used (repo settings → Actions secrets):
#   E2E_PASSWORD           — terminal APP_PASSWORD, used by e2e/global-setup.ts
#   HEALTHCHECKS_PING_KEY  — optional. Healthchecks.io project ping key (the
#     same one the cron routes use). The `nightly-prod-smoke` check is created
#     automatically on the first ping, so nothing needs setting up by hand.

on:
  schedule:
    - cron: '0 11 * * 1-5' # 7:00 AM ET (11:00 UTC) weekdays, pre-open
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    # For workflow_run triggers, only bother when CI on main succeeded
    # (a deploy will follow); scheduled + manual runs always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait out the Vercel deploy
        # After a merge to main, Vercel needs a few minutes to build and
        # promote. Scheduled runs skip straight through.
        if: ${{ github.event_name == 'workflow_run' }}
        run: sleep 240

      - name: Healthchecks — signal start
        env:
          HC_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
        run: |
          if [ -z "$HC_KEY" ]; then
            echo "HEALTHCHECKS_PING_KEY not set — skipping deadman ping."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC_KEY/nightly-prod-smoke/start?create=1" || true

      - name: Smoke + freshness against production
        id: smoke
        run: npx playwright test --grep "@smoke|@freshness"
        env:
          E2E_BASE_URL: https://terminal.johnwesleyhicks.com
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Healthchecks — report outcome
        # The watchdog for the watchdog. GitHub silently disables scheduled
        # workflows after 60 days of repo inactivity; if that happens this ping
        # simply stops arriving and Healthchecks raises the alarm on its own.
        if: ${{ !cancelled() }}
        env:
          HC_KEY: ${{ secrets.HEALTHCHECKS_PING_KEY }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [ -z "$HC_KEY" ]; then
            echo "HEALTHCHECKS_PING_KEY not set — skipping deadman ping."
            exit 0
          fi
          if [ "$SMOKE_OUTCOME" = "success" ]; then SUFFIX=""; else SUFFIX="/fail"; fi
          curl -fsS -m 10 --retry 3 "https://hc-ping.com/$HC_KEY/nightly-prod-smoke$SUFFIX?create=1" || true

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14

      - name: File / update the alarm issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="🚨 Nightly prod smoke is failing"
          BODY="The production smoke run failed on $(date -u '+%Y-%m-%d %H:%M UTC').

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Trigger: ${{ github.event_name }}

          Download the smoke-report artifact on the run page for per-test detail. Auto-close is deliberately NOT wired up — close this issue by hand once prod is verified green."
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number -q '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
