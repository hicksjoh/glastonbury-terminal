name: E2E Tests

# These tests run against LIVE PRODUCTION, so they are deliberately NOT a
# pull_request gate anymore — on a PR they were testing yesterday's deploy to
# judge today's code, which made every red run ambiguous (and trained us to
# ignore red for months). Prod verification now lives in two places:
#   - nightly-smoke.yml   → scheduled dead-man switch + post-deploy check
#   - this workflow       → manual full-suite run on demand
#
# Secrets: E2E_PASSWORD (terminal APP_PASSWORD) — global-setup refuses to run
# without it so an unauthenticated suite can't masquerade as a real result.

on:
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E Tests
        run: npx playwright test
        env:
          E2E_BASE_URL: https://terminal.johnwesleyhicks.com
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
